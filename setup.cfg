[flake8]
max-line-length = 120
exclude = .git,__pycache__,venv,.venv,.env,.tox,.eggs,build,dist,migrations
ignore = E203, W503

[isort]
profile = black
line_length = 88
skip = .git,__pycache__,venv,.venv,.env,.tox,.eggs,build,dist,migrations

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True